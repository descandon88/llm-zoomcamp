services:

  general:
    build: ./
    ports:
      - "8888:8888"
    volumes:
      - ./:/app
      - /app/.venv
      - ./01-agentic-rag/ingest.py:/app/ingest.py:ro
    env_file:
      - .env
    restart: unless-stopped

  module-01:
    build: ./01-agentic-rag
    ports:
      - "8889:8888"
    volumes:
      - ./01-agentic-rag:/app
      - /app/.venv
    env_file:
      - .env
    restart: unless-stopped

  module-02:
    build: ./02-vector-search
    ports:
      - "8890:8888"
    volumes:
      - ./02-vector-search:/app
      - /app/.venv
    env_file:
      - .env
    restart: unless-stopped

  module-02-homework:
    build: ./02-vector-search/02-homework
    ports:
      - "8891:8888"
    volumes:
      - ./02-vector-search/02-homework:/app
      - /app/.venv
      - ./02-vector-search/02-homework/ingest.py:/app/ingest.py:ro
      - ./01-agentic-rag/rag_helper.py:/app/rag_helper.py:ro
      - ./02-vector-search/02-homework/embed:/app/embed:ro

    env_file:
      - .env
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pswd
      POSTGRES_DB: faq
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  kestra_postgres:
    image: postgres:18
    volumes:
      - kestra_postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 10

  kestra:
    image: kestra/kestra:v1.3.21
    pull_policy: always
    user: "root"
    command: server standalone
    env_file:
      - .env
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      # SECRET_GEMINI_API_KEY: ${SECRET_GEMINI_API_KEY}
      SECRET_TAVILY_API_KEY: ${SECRET_TAVILY_API_KEY}
      SECRET_GEMINI_API_KEY: ${SECRET_GEMINI_API_KEY}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://kestra_postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basicAuth:
              username: "admin@kestra.io"
              password: Admin1234!
          repository:
            type: postgres
          storage:
            type: local
            local:
              basePath: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmpDir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
          ai:
            type: gemini
            gemini:
              model-name: gemini-2.5-flash
              api-key: ${SECRET_GEMINI_API_KEY}
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      kestra_postgres:
        condition: service_started

volumes:
  pgvector_data:
  kestra_postgres_data:
    driver: local
  kestra_data:
    driver: local
  kestra_tmp:
    driver: local
